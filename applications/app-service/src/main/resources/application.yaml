server:
  port: 8083
spring:
  application:
    name: "crediya-report-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://idp.example.com/issuer"
          client-id: "myclientid"
routes:
  paths:
    approvedLoansCount: "/api/v1/report/count"
    approvedLoansAmount: "/api/v1/report/amount"
aws:
  dynamodb:
    region: "us-east-1"
entrypoint:
  sqs:
    region: "us-east-1"
    queueUrl: "https://sqs.us-east-1.amazonaws.com/198413840757/Report_SQS"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
jwt:
  secret-key: "my-super-secret-key-1234567890123456"
  json-exp-roles: "role"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8083"
